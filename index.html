    }
});

document.addEventListener('paste', function(e) {
    const commentArea = e.target.closest('.comment-area');
    const evidenceBox = e.target.closest('.evidence-box');
    const clipboard = e.clipboardData || window.clipboardData;
    const items = Array.from((clipboard && clipboard.items) || []);
    const fileItem = items.find(item => item.type.startsWith('image/') || item.type === 'application/pdf');

    if (fileItem && (evidenceBox || activeEvidenceBox)) {
        e.preventDefault();
        const cleanId = evidenceBox ? evidenceBox.id.replace(/^evidence-box-/, '') : activeEvidenceBox;
        const file = fileItem.getAsFile();
        if (file) {
            if (!currentAttachments[cleanId]) currentAttachments[cleanId] = [];
            const attachment = {
                type: file.type.startsWith('image/') ? 'image' : 'pdf',
                title: file.name || (file.type.startsWith('image/') ? 'clipboard-image.png' : 'clipboard-document.pdf'),
                src: '',
                url: null,
                status: IMGBB_API_KEY && !IMGBB_API_KEY.includes('BURAYA') ? 'uploading' : 'pending'
            };
            currentAttachments[cleanId].push(attachment);
            renderPreviews(cleanId);

            const reader = new FileReader();
            reader.onload = function(evt) {
                attachment.src = evt.target.result;
                renderPreviews(cleanId);

                if (attachment.type === 'image') {
                    if (IMGBB_API_KEY && !IMGBB_API_KEY.includes('BURAYA')) {
                        uploadImageToImgbb(attachment, cleanId);
                    }
                } else {
                    uploadFileToDrive(attachment, cleanId, file.type);
                }
            };
            reader.readAsDataURL(file);
        }
        return;
    }

    if (!commentArea) return;

    e.preventDefault();
    let pasteHtml = clipboard.getData('text/html');
    let insertValue = '';

    if (pasteHtml) {
        insertValue = sanitizeCommentHTML(pasteHtml);
    }

    if (!insertValue) {
        const plainText = clipboard.getData('text/plain') || '';
        insertValue = sanitizePlainText(plainText);
    }

    if (insertValue) {
        document.execCommand('insertHTML', false, insertValue);
    }
});


const kidrData={"B.1.1": {"od": "Programların tasarım ve onay süreçleri sistematik olarak izlenmekte ve ilgili paydaşlarla birlikte değerlendirilerek iyileştirilmektedir.", "p": ["Avrasya Üniversitesi bünyesinde yürütülen Akreditasyona Ön Hazırlık çalışmaları kapsamında yer alan tüm eğitim–öğretim programlarının tasarımında, Türkiye Yükseköğretim Yeterlilikleri Çerçevesi (TYÇÇ), Ulusal Çekirdek Eğitim Programları (UÇEP), eğitim programlarının akademik ve mesleki temel alan yeterlilikleri ve YOKAK tarafından yetkilendirilen akreditasyon kuruluşlarının (FEDEK, FTR-AD, HEPDAK, İLEDAK, MEDEK, MİAK, MÜDEK, SABAK, STAR, SPORAK, TAPLAK) hazırladığı programlar için geliştirilmiş olan akreditasyon ölçütleri de  dikkate alınmaktadır. Üniversitemizde yer alan programların amaçları (OD4) ve öğrenme çıktıları (kazanımları) (OD4) belirtilmiş (OD4) oluşturulmuş, TYÇÇ ile uyumu , Programı Bilgileri, Program İçeriği, Bölüm Başkanı, Tarihçe, Kazanılan Derece, Kabul Koşuları, Üst Kademeye Geçiş, Mezuniyet Koşuları, Mezun İstihdam Olanakları, Ölçme ve Değerlendirme, Eğitim Türü Amaçlar ve Hedefler, Program Yeterlilikleri, Dersler, Ders ve Program Yeterlilikleri Matrisi, TYÇÇ ve Program Yeterlilikleri Matrisin kapsayan Bilgi Paketleri üniversitemiz resmi web sitesi üzerinde yer alan Bologna adresi (OD4) üzerinden kamuoyuna ilan edilmiştir. Fen Edebiyat Fakültesi Psikoloji Programı (\u0001https://tyc.gov.tr/yeterlilik/psikoloji-lisans-diplomasi-TR0030032806.html\u0002OD4\u0003) ve Türk Dili Edebiyatı Programı (\u0001https://tyc.gov.tr/yeterlilik/turk-dili-ve-edebiyati-lisans-diplomasi-TR0030032807.html\u0002OD4\u0003) temel yeterlilikler çerçevesine yerleştirilmiştir.", "Programların yeterlilikleri belirlenirken kurumun misyon vizyonu ile yetkilendirilmiş akreditasyon kuruluşlarının belirlediği ölçütler göz önünde bulundurulmuştur. Ders Bilgi Paketleri her akademik yılın sonunda iç/dış paydaşlardan alınan geri bildirimler kapsamında yeniden gözden geçirilerek güncellenmektedir. Bologna Süreci ile uyumlu olarak hazırlanan Ders Bilgi Paketlerinde, her derse ait öğrencilerin kazanması beklenen bilgi ve beceriler konu temelinde tanımlanmıştır. Ders kapsamında öğrencilerin elde etmesi gereken kazanımlar, Ders Bilgi Paketlerinde dersin öğrenme çıktıları başlığı altında belirlenmiştir (\u0001https://obs.avrasya.edu.tr/oibs/bologna/index.aspx?lang=tr&curOp=showPac&curUnit=1&curSunit=12410#\u0002OD4\u0003).", "Üniversitemizde yeni bölüm/anabilimdalı/program açılması işlemleri YÖK ün", "belirlediği tarih aralığında bir sonraki eğitim-öğretim yılı için YÖK’ün program açma ölçütleri çerçevesinde gerçekleştirilmektedir. Senato tarafından uygun görülen lisans/önlisans/lisansüstü program açma/ilk defa öğrenci alımı talebi YÖK’ün belirlediği tarihler arasında YÖKSİS üzerinden ABAYS sistemine girilmektedir.", "Akademik programlarda yeni ders açma veya mevcut dersleri değiştirme talepleri, \"Ders Açma/Değiştirme Formu\" üzerinden kurumsallaştırılmıştır. Bu süreçte; dersin amacı, program öğrenme çıktılarıyla (Örn: PÇ1, PÇ2) eşleşmesi, varsa ön koşulları ve ara sınav/yarıyıl sonu sınavlarını da kapsayan 15 haftalık ders içeriği detaylandırılarak ilgili birim kurullarının onayına sunulmaktadır [1_OD4]. İşletilen bu onay mekanizması, öğretim programlarının kurumun eğitim politikasıyla çelişmeden, standart bir akademik yapıda tasarlanmasını nesnel olarak güvence altına almaktadır."], "ev": [{"n": 1, "l": 3, "f": "B.1.1-Ders_acma_degistirme_formu.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](3)B.1.1-Ders_acma_degistirme_formu.pdf"}]}, "B.1.2": {"od": "Programlarda ders dağılım dengesi izlenmekte ve iyileştirilmektedir.", "p": ["Avrasya Üniversitesi programların ders dağılım dengesini sağlamaya yönelik ilke ve yöntemler tanımlanmış olup, müfredat yapılarında zorunlu-seçmeli ve alan içi-alan dışı ders dengesi titizlikle gözetilmektedir. Öğrencilerin farklı disiplinleri tanıma imkânı bulmaları ve disiplinlerarası yetkinlik kazanmaları amacıyla programlarda seçmeli ders oranının en az %25 olması güvence altına alınmıştır.", "Programlardaki ders dağılım dengesinin izlenmesi ve hedeflerle uyumunun denetlenmesi amacıyla güçlü bir kurumsal otokontrol mekanizması işletilmektedir. Kurumdaki tüm eğitim-öğretim programları, kendilerini akredite edecek yetkili ajansların (FEDEK vb.) belirlediği öz değerlendirme raporu şablonlarını temel alarak yıllık faaliyet raporlarını hazırlamaktadır. Bu süreç kapsamında, her program kendi müfredat yapısını ilgili akreditasyon ajansının şablonunda yer alan ders dağılım dengesi tablosuna her yıl düzenli olarak işlemek ve ajansın belirlediği ders dağılım kriterlerini eksiksiz bir biçimde sağlamak zorundadır.", "Kurum genelinde standartlaştırılan bu sistematik izleme ve raporlama uygulaması, son iki yıldır tüm programlarımızda hiçbir aksaklık yaşanmadan başarıyla devam etmektedir. İşletilen bu mekanizma sayesinde programların ders dağılım dengesi ile öğrenci iş yükleri periyodik olarak izlenmekte, akreditasyon ölçütlerinden sapma riski taşıyan durumlar anında tespit edilerek veri temelli müfredat iyileştirmelerine dönüştürülmektedir [1_OD4].", "Alan zorunlu, seçmeli, alan dışı seçmeli dersler ile ilgili sunulan imkanlara ek olarak öğrencilerimizin akademik gelişimlerini desteklemek amacıyla çevrimiçi sertifika programlarına destek verilmektedir. Bu bağlamda AYEUM veri tabanına abonelik her yıl yenilenmektedir (\u0001https://view.officeapps.live.com/op/view.aspx?src=https%3A%2F%2Fapi.yokak.gov.tr%2FStorage%2Favrasya%2F2024%2FProofFiles%2F%5B1%5D(4)B.1.2-AYEUM\u0002OD3)\u0003.(\u0001https://fef.avrasya.edu.tr/wp-content/uploads/2025/04/avu-fedek.jpeg\u0002OD4\u0003)."], "ev": [{"n": 1, "l": 4, "f": "B.1.2-ornek_ders_dagılım_dengesi_formu.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.1.2-ornek_ders_dag%C4%B1l%C4%B1m_dengesi_formu.pdf"}]}, "B.1.3": {"od": "Ders kazanımlarının program çıktılarıyla uyumu izlenmekte ve iyileştirilmektedir.", "p": ["Avrasya Üniversitesi'nde ders öğrenme kazanımlarının program çıktılarıyla uyumu, salt bir dokümantasyon (matris) düzeyinde bırakılmayarak sistematik ve veri temelli bir yaklaşımla ölçme-değerlendirme süreçlerine entegre edilmiştir. Program öğrenme çıktıları ile ders öğrenme kazanımları Bologna Bilgi Paketi sistemi üzerinden tanımlanmış olup; her dersin izlencesinde ilgili program çıktısına katkı düzeyi açık biçimde ilan edilerek yapılandırılmıştır [2_OD3].(\u0001https://obs.avrasya.edu.tr/oibs/bologna/index.aspx?lang=tr&curOp=showPac&curUnit=1&curSunit=11010#\u0002OD3\u0003) Kurum, tanımlanan bu uyumu izlemek ve nesnel verilere dayandırmak amacıyla Öğrenci Bilgi Sistemi (Proliz) altyapısına \"Sınav Kazanımı Akreditasyon Uyum ve Raporlama İşlemleri Modülü\" ile \"Akademisyen Soru Bazlı Not Girişi Modülü\"nü entegre etmiştir. Ölçme ve değerlendirme süreçlerinde kullanılan araçlar sadece klasik sınavlarla sınırlı tutulmamış; bitirme çalışmaları, staj/uygulama raporları ve AKTS iş yükü anketleri de program çıktılarıyla eşleştirilerek matrislerle kayıt altına alınmıştır. Yenilikçi Proliz sistemi üzerinden her bir sınav sorusunun veya ödevin ilgili kazanıma etki oranı tanımlanmakta; kazanımların gerçekleşme düzeyleri ders, program ve öğrenci bazında algoritmik olarak hesaplanarak raporlanmaktadır [1_OD4]. Ölçme-değerlendirme sürecindeki bu verilerin güvenilirliğini artırmak amacıyla, uygulamayı yapacak öğretim elemanlarının \"Eğiticilerin Eğitimi\" programlarını tamamlamaları zorunlu tutulmuştur. Ayrıca Kurum, kazanımları sadece akademik müfredatla sınırlamayan bütüncül bir kalite vizyonu geliştirmiştir. Öğrencilerin ders dışı sosyal ve bilimsel aktivitelerle elde ettikleri becerilerin program çıktılarına katkısı da ölçülerek, öğrencilere mezuniyet transkriptine ek olarak \"Yetkinlik Temelli Sosyal Transkript\" verilmesi güvence altına alınmıştır [_OD4]. Sistemsel verilerle elde edilen kazanım analizleri, düzenli olarak uygulanan dış paydaş anketleri ve öğrenci geri bildirimleriyle çapraz değerlendirmeye tabi tutulmaktadır [3_OD4]. Kurumda program çıktıları ve müfredat güncellemeleri doğrudan dış paydaşların sektörel beklentilerine göre şekillenmektedir. Örneğin, 2025 yılı bahar döneminde gerçekleştirilen Diş Protez Teknolojisi dış paydaş toplantısında alınan kararlar doğrultusunda program çıktıları güncel teknolojik gelişmeleri kapsayacak şekilde revize edilmiş ve ders içeriklerinde “oklüzör” konularının ağırlığı artırılmıştır [4_OD4]. Benzer şekilde Odyoloji Bölümü dış paydaş toplantısı sonucunda müfredat, pratik cihaz teknolojisi modülleriyle zenginleştirilerek program çıktılarının sahadaki karşılığı güvence altına alınmıştır Elde edilen analitik bulgular doğrultusunda, düşük gerçekleşme gösteren kazanımlar ile yetersiz desteklenen program çıktıları hızla tespit edilmektedir. Bu tespitler doğrultusunda bölüm ve fakülte kurullarında (Örn: FEDEK akreditasyon çalışmaları kapsamında FEF müfredat güncellemeleri) ders içerikleri, öğretim yöntemleri ve ölçme-değerlendirme yaklaşımlarında kanıta dayalı kurumsal güncellemeler  resmiyet kazanmaktadır [5_OD4]."], "ev": [{"n": 1, "l": 3, "f": "B.1.3-soru_kazanim_eslesme.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](3)B.1.3-soru_kazanim_eslesme.pdf"}, {"n": 2, "l": 4, "f": "B.1.3-FEF_Program_Çıktısı_Matrisleri.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.1.3-FEF_Program_%C3%87%C4%B1kt%C4%B1s%C4%B1_Matrisleri.pdf"}, {"n": 3, "l": 4, "f": "B.1.3-SHMYO_Agız_ve_Dis_Saglıgı_Paydas_Toplantısı.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[3](4)B.1.3-SHMYO_Ag%C4%B1z_ve_Dis_Sagl%C4%B1g%C4%B1_Paydas_Toplant%C4%B1s%C4%B1.pdf"}, {"n": 4, "l": 4, "f": "B.1.3-SHMYO_Agız_ve_Dis_Saglıgı_Paydas_Toplantısı.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[4](4)B.1.3-SHMYO_Ag%C4%B1z_ve_Dis_Sagl%C4%B1g%C4%B1_Paydas_Toplant%C4%B1s%C4%B1.pdf"}, {"n": 5, "l": 4, "f": "B.1.3-SBF_Ic_Paydas_Dıs_Paydas_Ogrenci_Geri_Bildirim_Toplantıları.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[5](4)B.1.3-SBF_Ic_Paydas_D%C4%B1s_Paydas_Ogrenci_Geri_Bildirim_Toplant%C4%B1lar%C4%B1.pdf"}, {"n": 6, "l": 4, "f": "B.1.3-SBF_Ic_Paydas_Dıs_Paydas_Ogrenci_Geri_Bildirim_Toplantıları.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[6](4)B.1.3-SBF_Ic_Paydas_D%C4%B1s_Paydas_Ogrenci_Geri_Bildirim_Toplant%C4%B1lar%C4%B1.pdf"}]}, "B.1.4": {"od": "Programlarda öğrenci iş yükü izlenmekte ve buna göre ders tasarımı güncellenmektedir.", "p": ["Kurumda eğitim-öğretim süreçleri, öğrenci merkezli yaklaşım doğrultusunda tamamen öğrenci iş yükü esasına dayalı olarak tasarlanmaktadır. Avrasya Üniversitesi Eğitim- Öğretim ve Sınav Yönetmeliği (\u0001https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=40328&MevzuatTur=8&MevzuatTertip=5\u0002OD3\u0003).(\u0001https://lee.avrasya.edu.tr/wp-content/uploads/2023/10/22-Ekim-2023-PAZAR.pdf\u0002OD3\u0003) ve AKTS Hesaplama Kılavuzu çerçevesinde, 1 AKTS kredisi 25-30 saatlik öğrenci iş yüküne karşılık gelecek şekilde standartlaştırılarak güvence altına alınmıştır [1_OD3]. Derslerin AKTS değerleri belirlenirken; öğrencilerin sınıf içi (teorik, uygulama, laboratuvar) ve sınıf dışı (ödev, proje, sunum, sınava hazırlık, mesleki uygulama, bireysel çalışma vb.) gerçekleştirdikleri tüm eğitim-öğretim faaliyetleri dikkate alınmakta ve şeffaf bir hesaplama yapılmaktadır. Derslerin iş yükü hesaplamaları, Bologna Bilgi Paketi sistemi üzerinden yürütülmekte; her bir ders için iş yükü kalemleri, tekrar sayıları ve süreleri ayrıntılı olarak ilan edilmektedir (\u0001https://obs.avrasya.edu.tr/oibs/bologna/index.aspx?lang=tr&curOp=showPac&curUnit=1&curSunit=12410#\u0002OD3\u0003). Bu sistematik yapı sayesinde derslerin AKTS kredileri ile öğrenme kazanımları ve ölçme-değerlendirme süreçleri arasında tam bir uyum sağlanmakta; haftalık iş yükü dağılımları, öğrencilerin akademik yoğunluğunu dengeleyecek bütüncül bir yaklaşımla oluşturulmaktadır. Öğrenci iş yüküne dayalı tasarımın sahadaki etkililiği ve gerçekçiliği salt planlama aşamasında bırakılmamakta; her yarıyıl sonunda sistemsel olarak uygulanan \"AKTS Öğrenci İş Yükü Değerlendirme Anketi\" aracılığıyla düzenli olarak izlenmektedir [2_OD4]. Öğrencilerin ders kapsamındaki faaliyetlere fiilen ayırdıkları zaman ve iş yüküne ilişkin algıları, anket verileri üzerinden sistematik biçimde analiz edilmektedir. Elde edilen anket analiz sonuçları ve ölçme-değerlendirme başarı düzeyleri, birim ve bölüm kurullarında düzenli olarak değerlendirilmektedir. Öngörülen iş yükü ile öğrencilerin bildirdiği gerçekleşen iş yükü arasında sapma tespit edilen derslerin bilgi paketlerindeki iş yükü bileşenleri ve AKTS değerleri bu kurul kararlarıyla güncellenmektedir (PUKÖ - Önlem Alma) [4_OD4]. Kurulan bu entegre izleme ve güncelleme mekanizması, Kurumda öğrenci iş yüküne dayalı tasarım yaklaşımının yalnızca başlangıçta yapılan bir planlama olmadığını; düzenli olarak izlenen, değerlendirilen ve en üst olgunluk düzeyinde (OD4) sürekli iyileştirilen dinamik bir kalite güvencesi sistemi olarak işletildiğini kanıtlamaktadır."], "ev": [{"n": 1, "l": 3, "f": "B.1.4-AKTS_Is_Yuku_Hesaplama_Kilavuzu.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](3)B.1.4-AKTS_Is_Yuku_Hesaplama_Kilavuzu.pdf"}, {"n": 2, "l": 4, "f": "B.1.4-SHMYO_Is_Yuku_AKTS_Anketi_ve_Karari_KVKK.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.1.4-SHMYO_Is_Yuku_AKTS_Anketi_ve_Karari_KVKK.pdf"}]}, "B.1.5": {"od": "Program çıktıları bu mekanizmalar ile izlenmekte ve ilgili paydaşların görüşleri de alınarak güncellenmektedir.", "p": ["Programların izlenmesi ve güncellenmesi süreçlerinde veri temelli yaklaşımlar benimsenmektedir. Bu kapsamda program çıktılarının doğrudan ölçülmesini desteklemek amacıyla Öğrenci Bilgi Sistemi üzerine entegre edilen sınav kazanımı ve ders öğrenme çıktısı bazlı akreditasyon uyum modülleri devreye alınmıştır. Söz konusu modüller aracılığıyla sınav soruları ders öğrenme çıktıları ile eşleştirilmekte ve yapılandırılmış değerlendirme yöntemleri kullanılarak program çıktılarının gerçekleşme düzeyi analiz edilmektedir. Elde edilen bulgular program öz değerlendirme raporlarında kullanılmakta ve müfredat güncelleme süreçlerine veri temelli girdi sağlamaktadır. Modülün ilk uygulamaları 2024-2025 eğitim-öğretim yılı güz yarıyılı sonunda gerçekleştirilmiş olup elde edilen sonuçlar doğrultusunda bazı derslerde ölçme-değerlendirme yöntemlerinin ve içerik tasarımlarının gözden geçirilmesine yönelik çalışmalar başlatılmıştır. Bu yaklaşım program geliştirme süreçlerinde sürekli iyileştirme ve kalite güvencesi kültürünün güçlenmesine katkı sunmaktadır.", "Fen Edebiyat Fakültesi bünyesinde yer alan iki bölüm için akreditasyon hazırlık çalışmalarının tamamlanmasının ziyareti (\u0001https://avukalite.avrasya.edu.tr/duyurular/akreditasyon-basvurulari-kapsaminda-fedek-tarafindan-degerlendirme-ziyareti/\u0002OD4\u0003) ardından FEDEK tarafından değerlendirme gerçekleştirilmiş ve Fen Edebiyat Fakültesi Psikoloji Programı ile Türk Dili ve Edebiyatı Programlarımız 5 yıl süreyle akredite edilmiştir. 2024-2025 Bahar dönemi sonrasında da Avrasya Üniversitesi Rektörlüğü tarafından odak grup toplantıları yapılmış (her yarıyıl açılan dersler, öğrenci sayıları, baş arı durumları, geri besleme sonuçları, ders çeşitliliği, lab uygulama, lisans/lisansüstü dengeleri, ilişki kesme sayıları/nedenleri vb.) akademisyenlerin görüşleri ile birlikte dolaylı da olsa öğrencilerin derslerde yada ofis saatlerinde ilettikleri istekleri de değerlendirilmiştir. Bu bağlamda yapılan geri bildirimler sonrasında 2024-2025 Eğitim Öğretim yılında Ağırlıklı Genel Not Ortalamasına bağlı burs kesintisi Müteveli Heyeti kararıyla kaldırılmıştır (OD4). Üniversite genelinde uygulanan dolaylı erişim ölçümlerinin yanı sıra, Öğrenci bilgi Sistemi üzerinde kullanılan \"Sınav Kazanımı Akreditasyon Uyum ve Raporlama İşlemleri Modülü\" ve \"Akademisyen Soru Bazlı Not Girişi Anket Modülü\" satın alınmış ve ders çıktılarını sınav sorularıyla eşleştirerek program çıktılarının doğrudan metotlar ile ölçümüne imkân sağlanmıştır. İlgili modüller vasıtasıyla ilk ölçümler 2024-2025 Güz dönemi sonunda gerçekleştirilmiştir. Her program ve ders için (örgün, uzaktan, karma, açıktan) program amaçlarının ve öğrenme çıktılarının izlenmesi planlandığı şekilde gerçekleşmektedir. Bu sü recin isleyişi ve sonuçları paydaşlarla birlikte değerlendirilmektedir (OD4) , (OD4) . Eğ itim ve ö ğ retim ile ilgili istatistiki göstergeler (her yarıyıl açılan dersler, öğrenci sayıları, başarı durumları, Öğretim Elemanı ve Ders Değerlendirme Anketleri, geri besleme sonuçları, ders çeşitliliği, laboratuvar, uygulama, lisans/lisansüstü dengeleri, ilişki kesme sayıları/nedenleri vb.) periyodik ve sistematik şekilde izlenmekte, tartışılmakta, değerlendirilmekte, karşılaştırılmakta ve kaliteli eğitim yönündeki gelişim sü rdurü lmektedir (ODR4) . Programların izlenmesi ve güncellenmesi çalışmaları", "kapsamında tüm lisans/ön lisans programlarının için, senelik olarak, belirlenen 5 başlık (Program Öz Değerlendirme Raporu, Paydaşlar, Etkinlikler, Protokoller, Anketler) kapsamında çalışmalarını gerçekleştirmeleri ve üst yönetime sunmaları beklenmektedir. Bu kapsamda programların izleme ve iyileştirme sürecinin sistemli bir şekilde yürütülmesini, iyileştirmelerin kayıt altına alınmasını ve takibini garanti altına alınmasını sağlayan programlar özelinde gerçekleştirilen tüm iş/işlemlere ait üst yönetim kalite ve akreditasyon geri bildirim toplantıları yapılmaktadır. Gerçekleştirilen iyileştirmeler: 2024-2025 Eğitim Öğretim Yılı itibariyle tüm önlisans/lisans programları tarafından Öz değerlendirme raporları ilgili programın akreditasyonu için yetkilendirilmiş kuruluşun şablon öz değerlendirme raporlarına göre yıllık olarak hazırlanmakta ve iyileştirmeler bir sonraki yılın raporuna yansıtılmaktadır. 2023-2024 eğitim Öğretim yılında Akreditasyon başvurusu yapılan Fen Edebiyat Fakültesi Psikoloji ve Türk Dili Edebiyatı Programları FEDEK tarafından 5 yıl süreyle tam akredite edilmiştir (\u0001https://fef.avrasya.edu.tr/\u0002OD4\u0003).", "Danışma kurulu kararıyla mezun yetkinlikleri doğrultusunda ders revizyonu yapılmıştır. YÖK talebi (dış geri bildirim) doğrultusunda müfredata 'Bağımlılıkla Mücadele' dersi eklenerek programda iyileştirme yapılmıştır (5_OD4). Dış paydaş geri bildirimleri sonucu, derslerin hastane ortamında yürütülmesine karar verilerek müfredat işleyişinde iyileştirme sağlanmıştır (6_OD4)."], "ev": [{"n": 1, "l": 4, "f": "B.1.5-fef_danisma_kurulu.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.1.5-fef_danisma_kurulu.pdf"}, {"n": 2, "l": 4, "f": "B.1.5-shmyo_ingilizce_revizyon.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.1.5-shmyo_ingilizce_revizyon.pdf"}, {"n": 3, "l": 4, "f": "B.1.5-shmyo_mezun_izleme.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[3](4)B.1.5-shmyo_mezun_izleme.pdf"}, {"n": 4, "l": 4, "f": "B.1.5-shmyo_isveren_analizi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[4](4)B.1.5-shmyo_isveren_analizi.pdf"}, {"n": 5, "l": 4, "f": "B.1.5-sbf_yeni_ders_eklenmesi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[5](4)B.1.5-sbf_yeni_ders_eklenmesi.pdf"}, {"n": 6, "l": 4, "f": "B.1.5-sbf_dis_paydas_toplantisi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[6](4)B.1.5-sbf_dis_paydas_toplantisi.pdf"}]}, "B.1.6": {"od": "Kurumda eğitim ve öğretim yönetim sistemine ilişkin uygulamalar izlenmekte ve izlem sonuçlarına göre iyileştirme yapılmaktadır.", "p": ["Avrasya Üniversitesi'nde eğitim ve öğretim süreçlerinin yönetimi, stratejik planda belirlenen kurumsal hedefler doğrultusunda bütüncül bir yaklaşımla şekillenmektedir. Bu süreçlerin icrası; Rektörlük makamı, Eğitim Öğretimden Sorumlu Rektör Yardımcılığı, Dekanlıklar ve Yüksekokul Müdürlükleri tarafından müştereken yürütülmektedir. Üniversite yönetişim yapısı içerisinde, Dekanlar, Enstitü ve Yüksekokul Müdürlerinden oluşan Akademik Birim Amirleri, Rektör başkanlığında periyodik olarak toplanarak süreçlerin uyumunu ve işleyişini yürürlükteki yasal mevzuatlar kapsamında denetlemektedir.", "Eğitim ve öğretim süreçlerini yönetmek üzere güçlü bir organizasyonel yapılanma (Üniversite Eğitim, Ölçme ve Değerlendirme Komisyonu, Sürekli Eğitim Merkezi, Uzaktan Eğitim Araştırma ve Uygulama Merkezi vb.) kurulmuş olup, eğitim faaliyetlerinin veri temelli yürütülmesi için Öğrenci Bilgi Sistemi (OBS), Öğrenme Yönetim Sistemi (TOLTEK LMS) ve Birim İç Değerlendirme Raporları Yükleme", "Sistemi entegre bir biçimde kullanılmaktadır. Eğitim ve öğretim programlarının tasarlanması, yürütülmesi, değerlendirilmesi ve güncellenmesi faaliyetlerine ilişkin ilkeler yasal mevzuatlarla belirlenmiş ve tüm süreci planlayan akademik takvim kamuoyuna ilan edilmiştir. Programlarda öğrenme kazanımları, öğretim programı (müfredat), eğitim hizmetinin verilme biçimi (örgün, uzaktan, karma, açıktan), öğretim yöntemleri ve ölçme-değerlendirme uyumu ile tüm bu süreçlerin koordinasyonu üst yönetim tarafından düzenli olarak takip edilmektedir.", "Kurumda eğitim ve öğretim yönetim sistemine ilişkin uygulamalar sistematik olarak izlenmekte ve izlem sonuçlarına göre operasyonel iyileştirmeler hayata geçirilmektedir. Dijitalleşme süreçleri kapsamında Öğrenci Bilgi Sistemi'nin kabiliyetleri büyük ölçüde artırılmış; sisteme Sınav Kazanımı Akreditasyon Uyum ve Raporlama İşlemleri Modülü, Akademisyen Sınav Not Girişi (Ders Öğrenme Çıktısı Bazlı - Akreditasyon) Modülü, Sosyal Transkript On-Line Başvuru ve Değerlendirme Modülü, Çap/Yandal Başvuru Modülü, Staj Başvuru ve Takip Otomasyonu ile Yatay Geçiş On-Line Başvuru ve Otomatik Değerlendirme Modülü gibi birçok yeni dijital altyapı eklenmiştir. Temel eğitim-öğretim adımlarının ve öğrenci iş/işlemlerinin büyük veri kaynağı olarak dijitalleştirilerek güvence altına alınmıştır."], "ev": []}, "B.2.1": {"od": "Öğrenci merkezli uygulamalar izlenmekte ve ilgili iç paydaşların katılımıyla iyileştirilmektedir.", "p": ["Avrasya Üniversitesi'nde eğitim-öğretim faaliyetleri, bilginin pasif aktarımından ziyade derin öğrenmeyi, öğrenci motivasyonunu ve aktif katılımı merkeze alan etkileşimli yöntemlerle yürütülmektedir. Tüm eğitim türlerinde (örgün, uzaktan, karma) derslerin doğasına uygun öğrenci merkezli öğretim yöntemleri (ters yüz öğrenme, proje temelli öğrenme, vaka analizi, beyin fırtınası, istasyon, rol oynama vb.) Bologna Bilgi Paketi üzerinden ilan edilerek güvence altına alınmaktadır (\u0001https://obs.avrasya.edu.tr/oibs/bologna/index.aspx?lang=tr&curOp=showPac&curUnit=10&curSunit=111093#\u0002OD3\u0003) . Öğrencileri araştırma süreçlerine ve aktif öğrenmeye dahil etmek amacıyla dersler, dijital etkileşim araçlarıyla teknolojik olarak zenginleştirilmektedir. Sınıf Yönetimi dersinde Mentimeter gibi dijital etkileşim araçları kullanılarak öğrenciyi merkeze alan aktif öğrenme yöntemleri uygulanmıştır (1_OD3) Öğrenciyi öğrenme sürecinin aktif öznesi kılan bu yaklaşım, Kurum bünyesindeki farklı akademik birimlerde çok disiplinli ve saha odaklı uygulamalarla hayata geçirilmektedir. Örneğin; Türk Dili ve Edebiyatı (TDE) öğrencileri ile TÖMER öğrencileri arasında \"gösterip yaptırma ve örnek olay\" teknikleriyle gerçekleştirilen çok kültürlü akran öğrenmesi, SHMYO akran deneyim paylaşımı etkinleri [3_OD4].[4_OD4], İngilizce Mütercim Tercümanlık bölümünde uygulanan akademik film çevirisi görevleri, Psikoloji programındaki rol canlandırma (role-playing) etkinlikleri ve Çocuk Gelişimi programının \"Geleceğimiz Çocuklarımızda – Oyun Alanları Oluşturma\" sosyal sorumluluk projeleri, teorik bilginin yetkinliğe dönüştürüldüğü en güçlü öğretim uygulamalarıdır.", "Uygulanan öğretim yöntem ve tekniklerinin etkililiği, öğrenci geri bildirim toplantıları ve anketler aracılığıyla periyodik olarak izlenmektedir. Örneğin, Meslek Yüksekokulunda gerçekleştirilen öğrenci geri bildirim toplantılarında teorik bilginin sahadaki karşılığını görmenin motivasyonu yükselttiği yönündeki öğrenci talepleri dikkate alınmış; bölüm kurullarında yapılan değerlendirmeler sonucunda müfredattaki \"vaka analizi, proje ve saha destekli uygulamaların ağırlığının artırılmasına\" resmi olarak karar verilmiştir.", "Ayrıca öğretim elemanlarının bu yenilikçi yöntemleri derslere etkili biçimde entegre edebilmeleri için \"Eğiticilerin Eğitimi Programı\" uygulanmakta olup, tüm öğretim elemanlarının bu pedagojik eğitimi tamamlaması zorunlu tutulmuştur. Geri bildirim mekanizmaları ve eğiticilerin kapasite gelişimiyle desteklenen bu sistem, Kurumda öğrenci merkezli öğretim kültürünün en üst olgunluk düzeyinde yönetildiğini ve sürekli iyileştirildiğini kanıtlamaktadır (\u0001https://avukalite.avrasya.edu.tr/duyurular/egitimcilerin-egitimi-programi-sertifika-toreni-sbf/\u0002OD4\u0003).(\u0001https://avukalite.avrasya.edu.tr/duyurular/egitimcilerin-egitimi-programi-sertifika-toreni-shmyo/\u0002OD4\u0003).(\u0001https://avukalite.avrasya.edu.tr/duyurular/18-nisan-2025-tarihli-idari-birimler-kalite-ve-akreditasyon-toplantisi/\u0002OD4\u0003).(\u0001https://avukalite.avrasya.edu.tr/duyurular/egitimcilerin-egitimi-programi-sertifika-toreni-mmf/\u0002OD4\u0003).", "Başarılı/Başarısız sisteminden 100'lük harf notu sistemine geçilerek ölçme- değerlendirme adaletinde iyileştirme yapılmıştır (2_OD4). Detayları D.2.1. başlığında verilen \"Geleceğimiz Çocuklarımızda – Oyun Alanları Oluşturma ve Sosyal Sorumluluk Projesi\" vb. gibi etkinliklerle öğrencilerimiz teorik bilgiyi sahada sosyal sorumluluk projeleriyle uygulamaya dökmektedir."], "ev": [{"n": 1, "l": 3, "f": "B.2.1-sbf_aktif_ogrenme.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](3)B.2.1-sbf_aktif_ogrenme.pdf"}, {"n": 2, "l": 4, "f": "B.2.1-sbf_harf_notu_gecis.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.2.1-sbf_harf_notu_gecis.pdf"}, {"n": 3, "l": 4, "f": "B.2.1-shmyo_akran_soylesisi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[3](4)B.2.1-shmyo_akran_soylesisi.pdf"}, {"n": 4, "l": 4, "f": "B.2.1-Staj_Akran_Egitimi_Etkinligi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[4](4)B.2.1-Staj_Akran_Egitimi_Etkinligi.pdf"}]}, "B.2.2": {"od": "Öğrenci merkezli ölçme ve değerlendirme uygulamaları izlenmekte ve ilgili iç paydaşların katılımıyla iyileştirilmektedir.", "p": ["Avrasya Üniversitesinin tüm Fakülte ve Yüksekokul ve Meslek Yüksekokullarında ön lisans, lisans ve yüksek lisans düzeyinde öğrenim gören öğrencilerin başarı durumları mutlak değerlendirme sistemine göre belirlenmektedir. Avrasya Üniversitesi ölçme ve değerlendirmedeki ana ilkelerini, sınav türlerini, sınav türlerinin geçme notuna olan katkılarını “Avrasya Üniversitesi Önlisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği” (\u0001https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=40328&MevzuatTur=8&MevzuatTertip=5\u0002OD4\u0003) ve “Avrasya Üniversitesi Lisansüstü Eğitim-Öğretim ve Sınav Yönetmeliği” ile belirlemiş ve resmi web sitesi üzerinden ilan etmiştir (\u0001https://lee.avrasya.edu.tr/wp-content/uploads/2023/10/22-Ekim-2023-PAZAR.pdf\u0002OD4\u0003). Öğrenci merkezli ölçme ve değerlendirme, yetkinlik ve performans temelinde yürütülmekte ve öğrencilerin kendini ifade etme olanakları mümkün olduğunca çeşitlendirilmektedir. Ölçme ve değerlendirmenin sürekliliği çoklu sınav olanakları ve bazıları süreç odaklı (formatif) ödev, proje, portfolyo gibi yöntemlerle sağlanmaktadır. Ders kazanımlarına ve eğitim türlerine (örgün, uzaktan, karma) uygun sınav yö ntemleri planlamakta ve uygulanmaktadır. Sınav uygulama ve güvenliği (örgün/çevrimiçi sınavlar, dezavantajlı gruplara yönelik sınavlar) mekanizmaları bulunmaktadır. Bir öğrencinin mutlak başarı puanı, o derse ait dönem içi notu ile yarıyıl sonu puanının,", "belirli oranlarda katkısından oluşur. Yarıyıl içi notunun ağırlığı %40 ve yarıyıl sonu sınavının ağırlığı %60’tır. Uygulamalı ve teorik ağırlık taşıyan derslerde sınavlar %50 teori ve %50 uygulama olacak şekilde yapılabilir. Yarıyıl içi notu tespitinde en az %20 ağırlığa sahip sınav ara sınav haftasında yapılır. Öğretim elemanı gerekli görürse diğer %20’lik değerlendirme için önceden ilan edilmiş takvim doğrultusunda ödev, proje, kısa sınav, seminer, sunum, laboratuvar uygulaması, arazi çalışması, eskiz, rapor ve benzeri çalışmalar yaptırabilir. Bu değerlendirmeler ders saatinde yapılır. Bu tür çalışmalar yaptırılmadığında ara sınav %40 ağırlığa sahip olur. Başarı notlarının ifade ettikleri başarı dereceleri ve katsayıları, 4.00 üzerinden hesaplanır. Bu değerlendirme sonunda, her öğrenciye dersi veren öğretim elemanı tarafından aşağıdaki tabloda açılımı ve kat sayıları belirtilen harf notlarından biri başarı notu olarak takdir olunur. Bir dersin başarı notunun hesaplanabilmesi için dönem sonu/bütünleme sınavından 100 üzerinden en az 50 puan alınması zorunludur. Dönem sonu/bütünleme sınavından 50 puan altında alınması durumunda başarı notu hesaplanmaz ve öğrencinin harf notu FF olarak sonuçlanır. Bir dersten AA, BA, BB, CB, CC ve B notu alan öğrenciler o dersten doğrudan başarılı sayılırlar. Bir dersten FF, FD, K notlarından birisini alan öğrenci, o dersten başarısız sayılır. Başarı baraj notu en az 2.00’dır. Herhangi bir yarıyıl sonunda AGNO’su başarı baraj notunun altında kalan öğrenciler, sınamalı öğrenci sayılırlar. AGNO’su art arda iki yarıyıl başarı baraj notunun altında olan öğrenciler başarısız duruma girer. Herhangi bir dersten DC ve DD notu alan öğrencilerin o dersten başarılı sayılabilmeleri için AGNO’sunun dersin alındığı yarıyıl veya dersin alındığı yarıyılı takip eden yarıyıl sonunda 2.00’dan düşük olmaması gerekir. Bu şartı yerine getiremeyen öğrenci DD ve DC notlarını almış olduğu derslerden başarısız sayılır. Tekrar alınan derslerin başarı notu not durum belgesinde tekrarlandıkları döneme işlenir. Tekrar edilen dersler için de başarı baraj notu 2.00’dır. Sınav soruları yapılandırılmış cevap anahtarlarıyla birlikte hazırlanmaktadır. Cevap anahtarlarında hangi sorunun hangi öğrenim çıktısına karşılık geldiği yer almaktadır. Ayrıca cevap anahtarlarında detaylı şekilde puanlandırma da yer almaktadır. Laboratuvar, Uygulama, Alan Çalışma, Kısa Sınavlar (Quiz), Ödevler, Sunum, Projeler, Ara Sınavlar, Dönem Sonu Sınavı gibi tüm başarı ölçme kriterleri her ders için dersin bilgi paketinde yüzdelik dağılımlarıyla birlikte yer almaktadır. Müfredat kapsamında yer alan 5i (Atatürk İlkeleri ve İnkılap Tarihi, Türk Dili ve İngilizce) derslerinin ölçme ve değerlendirmeleri ise çoktan seçmeli sınavlarla yapılmaktadır. Öğrencinin yapılan ölçme ve değerlendirmeye herhangi bir itirazı olması durumunda öğrenci ile girdiği sınava ait karne paylaşılmaktadır. Öğrenci karne de açıkça girdiği sınavların doğru cevap anahtarlarını ve kendisi tarafından optik forma yapılan kodlamayı izleyebilmektedir."], "ev": [{"n": 1, "l": 4, "f": "B.2.2-soru_kazanim_eslesme.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.2.2-soru_kazanim_eslesme.pdf"}, {"n": 2, "l": 4, "f": "B.2.2-shmyo_opo_odev_rubrikleri.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.2.2-shmyo_opo_odev_rubrikleri.pdf"}, {"n": 3, "l": 3, "f": "B.2.2-shmyo_iay_uygulama_sinavi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[3](3)B.2.2-shmyo_iay_uygulama_sinavi.pdf"}]}, "B.2.3": {"od": "Öğrenci kabulü, önceki öğrenmenin tanınması ve kredilendirilmesine ilişkin süreçler izlenmekte, iyileştirilmekte ve güncellemeler ilan edilmektedir.", "p": ["Avrasya Üniversitesine kabul edilecek öğrencilerin seçimi ve tercihlerine göre yerleştirilmeleri 2547 sayılı Yükseköğretim Kanununun 45. maddesi uyarınca Ölçme, Seçme ve Yerleştirme Merkezi (ÖSYM) tarafından düzenlenen Yükseköğretim Kurumları Sınavı (YKS) sonucunda alınan puanlar, yapılan tercihler ve önceden belirlenen kontenjanlar dikkate alınarak ÖSYM tarafından yapılır. Merkezi yerleştirmeyle gelen öğrenci grupları dışında kalan özel yetenek ve yatay geçiş usulüyle ya da , uluslararası (yabancı uyruklu) öğrenci statüsü ile gelen öğrencilerin kabulüne ilişkin ilke ve kura ların belirlendiği yönerge ve senato kararları bulunmaktadır. Özel Yetenek Sınavı gerektiren programlar, Yükseköğretim Kurumları Sınavı (YKS) Yükseköğretim Programları ve Kontenjan Kılavuzu Tablo-5 te yer almakta olup tablo kapsamında yer alan programlarımıza öğrenci alımında yapılan özel yetenek sınavları ve değerlendirme işlemleri Yükseköğretim Kurulunun belirlediği ilke ve kurallar doğrultusunda üniversitemiz tarafından yapılmaktadır [1_OD3].  Bu ilke ve kurallar birbiri ile tutarlı olup, uygulamalar şeffaftır.", "Diploma, sertifika gibi belge talepleri titizlikle takip edilmektedir. Üniversite içinden ya da başka üniversitelerden yatay geçişlerde, 24/4/2010 tarihli ve 27561 sayılı Resmi Gazete’ de yayımlanan Yü ksekö ğretim Kurumlarında Önlisans ve Lisans Dü zeyindeki Programlar Arasında Geçiş , Çift Anadal, Yan Dal ile Kurumlar Arası Kredi Transferi Yapılması Esaslarına ilişkin Yö netmelik (\u0001https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=13948&MevzuatTur=7&MevzuatTertip=5\u0002OD4\u0003) hü kü mleri ile Senato tarafından belirlenen esaslar uygulanır.", "Önceki ö ğ renmenin (ö rgü n, yaygın, uzaktan/karma eğitim ve serbest ö ğ renme yoluyla edinilen bilgi ve becerilerin) tanınması ve kredilendirilmesi Avrasya Üniversitesi Önceden Kazanılmış Yeterliliklerin Tanınması, Kredi Transferi ve İntibak İşlemleri Yönergesine göre yapılmaktadır. Uluslararasılaşma politikasına (\u0001https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=13948&MevzuatTur=7&MevzuatTertip=5\u0002OD4\u0003) paralel hareketlilik destekleri, öğrenciyi teşvik, kolaylaştırıcı önlemler bulunmaktadır ve hareketlilikte kredi kaybı olmaması yö nü nde uygulamalar vardır. Öğrencilerin akademik değişim programları ile yurt içi ve yurt dışı üniversitelerden aldıkları derslerin karşılıkları Avrasya Üniversitesinde kayıtlı oldukları programda yoksa program kazanımları dikkate alınarak intibak işlemleri yapılmaktadır. İntibak işleminde, öğrencinin akademik değişim programında almış olduğu dersler, Bölüm Başkanlığı’nın önerisi üzerine içeriğine bakılmaksızın kendi ders planında yer alan eş değer kazanımlı alan içi ya da alan dışı dersler yerine sayılmaktadır.", "Üniversitemize Dikey Geçiş Sınavları ile öğrenci kabulü yapılmaktadır. Dikey geçişlerde 19/2/2002 tarihli ve 24676 sayılı Resmî Gazete’de yayımlanan Meslek Yüksekokuları ve Açıköğretim Ön Lisans Programları Mezunlarının Lisans Öğrenimine Devamları Hakkında Yönetmelik (\u0001https://www.mevzuat.gov.tr/mevzuat?MevzuatNo=8315&MevzuatTur=7&MevzuatTertip=5\u0002OD4)\u0003 hükümleri uygulanmaktadır. Lisansüstü programlara öğrenci kabulü güz ve bahar döneminde ilgili eğitim öğretim yılının akademik takviminde ilan edilen tarihlerde yapılmaktadır. Avrasya Üniversitesi bünyesinde yer alan fakülte/yüksekokul/meslek yüksekokulu programlarına başvurmak isteyen adaylar, YKS sınavının ilgili puan türünde yeterli puanı elde etmelidir. YKS yerleştirme sonucuna göre Avrasya Üniversitesi fakülte/yüksekokul/ meslek yüksekokulu programını  kazanan adaylar eş düzeyde başka bir yükseköğretim programına kayıtlı olmamaları şartıyla programa kesin kayıtlarını yaptırabilmektedirler.  Aday öğrenciler kayıt işlemlerini tamamladıktan sonra Avrasya Üniversitesi öğrencisi olur ve", "yürürlükteki mevzuatın sağladığı tüm öğrencilik haklarından yararlanırlar. Öğrenci bilgi sistemi üzerinden öğrenci numaralarını unutmaları halinde “Öğrenci Numara Sorgulama” işlemi de yapabilirler.", "Avrasya Üniversitesi’nde kayıt kabul işlemleri, Öğrenci İşleri Daire Başkanlığı tarafından yürütülmekte olup, kayıt için gerekli belgelere (\u0001https://avrasya.edu.tr/kayit-islemler/\u0002OD4\u0003) , resmi web adresinden ulaşılabilir. yönetmelik ve yönergelere ilişkin bilgilere (\u0001https://avrasya.edu.tr/yonetmelik-ve-yonergeler/\u0002OD4\u0003) Avrasya Üniversitesi’nin Stratejik amaçları doğrultusunda öğrenci kabulü, önceki öğrenimin tanınması, kredilendirilmesi süreçlerine ait benimsediği uygulamaları mevcuttur. Tüm bu süreçler yürürlükte olan çerçeve yönetmeliklerle uyumlu olarak yapılandırılmış yönetmelik ve yönerge hükümleri çerçevesinde yürütülmektedir. Akademik takvimde ilan edilen tarihte ortak dersler kapsamında yer alan İngilizce I ve İngilizce II dersleri için muafiyet sınavı yapılır. İsteye bağlı olarak muafiyet sınavına katılarak başarı olan öğrenciler başarılı oldukları derslerden muaf olurlar."], "ev": [{"n": 1, "l": 3, "f": "B.2.3-2025_YKS _SPOR _BİLİMLERİ _İÇİN_ÖZEL _YETENEK _SINAVI _(ÖZYES).pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](3)B.2.3-2025_YKS _SPOR _B%C4%B0L%C4%B0MLER%C4%B0 _%C4%B0%C3%87%C4%B0N_%C3%96ZEL _YETENEK _SINAVI _(%C3%96ZYES).pdf"}]}, "B.2.4": {"od": "Uygulamalar izlenmekte ve tanımlı süreçler iyileştirilmektedir", "p": ["Avrasya Üniversitesi'nde yeterliliklerin sertifikalandırılması ve diploma işlemleri, “Avrasya Üniversitesi Ön Lisans ve Lisans Eğitim-Öğretim ve Sınav Yönetmeliği” ve “Avrasya Üniversitesi Lisansüstü Eğitim-Öğretim ve Sınav Yönetmeliği” nde tanımlanmıştır. Önlisans veya Lisans düzeyinde; Kayıtlı olduğu bölüm veya programın ders planındaki bütün çalışmalarından başarılı olmuş, lisans düzeyinde 240 AKTS, önlisans düzeyinde ise 120 AKTS kredisini tamamlayarak AGNO’sunu en az 2.00 düzeyine çıkarmış öğrenci öğrenimini bitirmiş sayılır. Bu öğrencilere ilgili yönetmeliğin 43 üncü maddesinde yer alan hükümlerine göre tamamlayan öğrencilere ilgili yönetim kurulu kararı ile diploma ve diploma eki verilir. Avrasya Üniversitesi Türkçe Öğretimi Uygulama ve Araştırma Merkezinde (TÖMER)  ise yabancı uyruklu öğrenci ve vatandaşlara Türkçe eğitimi verilmektedir (\u0001https://avrasya.edu.tr/turkce-ogretim-merkezi/\u0002OD4\u0003).(\u0001https://avrasya.edu.tr/wp-content/uploads/2023/12/2-Diploma-Yonergesi-Ekim-2023.pdf\u0002OD4)\u0003.", "Yeterliliklerin sertifikalandırılması veya belgelenmesi, diploma çeşitleri, onur ve yüksek onur belgeleri, diploma eki gibi belgelerin hazırlanmasında uygulanacak esaslar “Avrasya Üniversitesi Diploma Yönergesi” (\u0001https://avrasya.edu.tr/wp-content/uploads/2023/12/2-Diploma-Yonergesi-Ekim-2023.pdf\u0002OD4\u0003) ile Sertifikalandırma ve diploma işlemleri bu tanımlı sürece uygun olarak yürütülmekte, izlenmekte ve gerekli önlemler alınmaktadır. Yeterliliklerin onayı, mezuniyet koşulları, mezuniyet karar süreçleri açık, anlaşılır, kapsamlı ve tutarlı şekilde ilgili yönetmelik ve yönergelerimizle tanımlanmıs ve kamuoyu ile paylaşılmıştır. Öğrencilerin yerleşip kayıt yaptırdıkları ilgili programdan mezun olabilmeleri için almaları gereken AKTS’ler ilgili mevzuat ile belirlenmiştir. Avrasya Üniversitesi Lisans Önlisans Eğitim Öğretim Yönetmeliği’nin “Madde 42. Kayıtlı olduğu bölüm veya programın ders planındaki bütün çalışmalardan başarılı olmuş, lisans düzeyinde 240", "AKTS, önlisans düzeyinde ise 120 AKTS kredisini tamamlayarak AGNO’sunu en az 2.00 düzeyine çıkarmış öğrenci öğrenimini bitirmiş sayılır. Bu öğrencilere 43 üncü madde hükümlerine göre diploma verilir.” Hükmü gereğince mezun olma hakkını elde ederler. Öğrencilerin mezuniyetleri için gerek duydukları kredi koşulları, bağlı oldukları müfredat gereği almaları gereken zorunlu ve seçmeli ders bilgileri, Öğrenci Bilgi Sistemi aracılığıyla sağlanmaktadır (\u0001https://obs.avrasya.edu.tr/\u0002OD3\u0003). Ders dönemlerinin başlangıcında ilgili dönemde açılan tüm derslerin (zorunlu ve seçmeli) listesi ve haftalık ders programı birimlerin web sayfasından yayımlanmaktadır (\u0001https://psikoloji.avrasya.edu.tr/ders-programi/\u0002OD3\u0003). Öğrenciler Öğrenci Bilgi Sistemi üzerinden ders seçimlerini tamamladıktan sonra akademik danışmanlarının onayına göndermektedirler. Öğrencilerin  sınıf düzeyleri ve akademik ortalamaları itibariyle almaları gereken dersler/krediler akademik danışmanlar tarafından kontrol edilerek öğrencinin kaydı onaylanmaktadır. Öğrenci bilgi sistemine öğrencilerin kazandıkları yıl itibariyle bağlı oldukları müfredatları yüklenmekte ve eğitim öğretim süreci boyunca öğrencilerin mezun olabilmeleri için gerekli koşulları ne oranda sağladıklarını göstermektedir. Mezuniyet süreçlerine ait iş ve işlemler akademik danışmanlar ve Öğrenci İşleri Daire Başkanlığı koordinasyonunda yürütülmektedir. Akademik danışmanlar ve Öğrenci İşleri Daire Başkanlığı tarafında Öğrenci Bilgi Sistemin’de öğrencinin gerekli olan mezuniyet şartlarının sağlayıp sağlamadığı kontrol edilmektedir. Mezuniyet öncesinde Öğrenci Bilgi Sistemi’nde oluşan transkript esas alınmaktadır. Mezuniyet işlemleri sağlanan kontrollerinin ardından akademik danışmanın “Mezun Olur” onayı ile başlatılır [1_OD4]. Gerçekleştirilen İyileştirmeler: Fen edebiyat Fakültesi Psikoloji Programı ve Türk Dili ve Edebiyatı Programı öğrencileri 2024-2025 Eğitim Öğretim yılı itibariye mezun olmaya hak kazandıklarında, akredite bir programdan mezun olacaklar (\u0001https://avukalite.avrasya.edu.tr/duyurular/avrasya-universitesinde-akreditasyon-belgesi-takdim-toreni/\u0002OD4\u0003)."], "ev": [{"n": 1, "l": 4, "f": "B.2.4-OBS_Mezuniyet_Onayi_Ekrani.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.2.4-OBS_Mezuniyet_Onayi_Ekrani.pdf"}]}, "B.3.1": {"od": "Öğrenme kaynaklarının geliştirilmesine ve kullanımına yönelik izleme ve iyileştirilme yapılmaktadır.", "p": ["2024 KIDR de kurumun fiziki kaynaklarına yer verilmiştir. Kurum, eğitim-öğretim faaliyetlerini nitelikli biçimde sürdürebilmek ve öğrencilere fırsat eşitliğine dayalı öğrenme olanakları sunabilmek amacıyla eş zamanlı ve eş zamansız öğrenmeyi destekleyen Öğrenme Yönetim Sistemini (LMS) tüm akademik birimlerin kullanımına sunmuştur (\u0001https://kampus.avrasya.edu.tr/Account/Login?ReturnUrl=%2F\u0002OD3\u0003). Zenginleştirilmiş içerik sağlayan bu dijital öğrenme ortamının yeterliliği ve öğrenciler tarafından kullanım durumu, entegre analitik araçlar (Kullanıcı Etkileşim İzleme Mekanizmaları) üzerinden periyodik olarak izlenmektedir [2_OD4]. [6_OD4].", "2025 yılı LMS çeyrek dönem kullanıcı etkileşim verileri analiz edildiğinde; sistemin eğitim-öğretim dönemlerinde son derece aktif kullanıldığı saptanmıştır. Özellikle birinci çeyrekte (Ocak-Mart) 6.667 etkin kullanıcının sisteme erişim sağladığı, kullanıcı başına ortalama etkileşim süresinin 4 dakika 23 saniye gibi yüksek bir düzeyde gerçekleştiği", "ve 99.898 sayfa görüntülemesi yapıldığı belgelenmiştir [3_OD4]. Yılın son çeyreğinde (Ekim-Aralık) ise etkin kullanıcı sayısının 8.216'ya yükseldiği görülmektedir [4_OD4].", "Öğrenci eğilimlerini yansıtan sayfa görüntüleme detayları incelendiğinde; öğrencilerin uzaktan yürütülen ortak zorunlu derslere (Örn: Atatürk İlkeleri ve İnkılap Tarihi I, İngilizce I, Türk Dili I) ve mesleki sertifika/eğitim alanlarına (Örn: İş Sağlığı ve Güvenliği Sertifika Eğitimi, Sağlıkta Meslek Etiği) LMS üzerinden yoğun erişim sağladığı tespit edilmiştir (OD3) ( bakınız Her çeyrek verisinde yer alan ders başlıkları). Aynı zamanda sistemdeki \"Yeni İçerik\", \"Ders Notu\" ve \"Yüklemeler\" ekranlarındaki trafik yoğunluğu, eğitim materyallerinin kurumun genelinde aktif olarak paylaşıldığını ve öğrenci-materyal etkileşiminin kesintisiz sağlandığını göstermektedir.", "Kurum, elde edilen bu dijital izleme verilerini yalnızca bir istatistik olarak kayıt altında tutmamakta, PUKÖ döngüsünün \"Önlem Alma\" aşamasında aktif olarak kullanmaktadır. Yaz dönemine (Temmuz-Eylül) denk gelen üçüncü çeyrekte etkin kullanıcı sayısının 2.495'e, ortalama etkileşim süresinin ise 39 saniyeye düşmesi ve çeyrekler arası etkileşim süresi farklılıkları (Örn: Birinci çeyrek 4 dk. 23 sn. iken ikinci çeyrekte 45 sn.) akademik birimlerle paylaşılarak değerlendirilmektedir [2_OD4]. Bu analitik veriler ışığında ders materyallerinin zenginleştirilmesi, dijital içeriklerin öğrenciyi daha fazla sistemde tutacak niteliğe kavuşturulması ve öğrenme ortamlarının sürekli güncellenmesi yönünde karar alma mekanizmaları işletilmektedir", "Kurumumuzda öğrenme ortamları ve fiziksel kaynakların yönetimi, paydaş geri bildirimlerine dayalı sistematik bir izleme ve iyileştirme mekanizmasıyla yürütülmektedir. Bu kapsamda, mevcut altyapıların eğitim-öğretim çıktılarını destekleme düzeyi düzenli olarak değerlendirilmektedir Bu sürecin somut bir örneği olarak; Sağlık Bilimleri Fakültesi Odyoloji Bölümü laboratuvar altyapısına yönelik iç ve dış paydaşlardan gelen geri bildirimler analiz edilmiştir. Yapılan analizler neticesinde tespit edilen teknik donanım eksiklikleri ve fiziksel iyileştirme ihtiyaçları, üst yönetime sunulmuştur  Söz konusu rapor doğrultusunda gerekli kaynak planlaması yapılmış ve eğitim ortamının niteliğini artıracak teknik güncellemeler hayata geçirilmiştir [\u0001https://kampus.avrasya.edu.tr/Account/Login?ReturnUrl=%2F\u00021_OD4\u0003]."], "ev": [{"n": 1, "l": 4, "f": "B.3.1-B.3.1_SBF_Odyoloji_Lab_Iyilestirme_Raporu.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.3.1-B.3.1_SBF_Odyoloji_Lab_Iyilestirme_Raporu.pdf"}, {"n": 2, "l": 4, "f": "B.3.1-LMS_Kullanici_Etkilesim_ve_Sayfa_Goruntuleme_Analiz_Raporu_2025.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.3.1-LMS_Kullanici_Etkilesim_ve_Sayfa_Goruntuleme_Analiz_Raporu_2025.pdf"}, {"n": 3, "l": 4, "f": "B.3.1-2025_Yili_1_Ceyrek_Etkin_Kullanici_ve_Etkilesim_Suresi_Verileri.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[3](4)B.3.1-2025_Yili_1_Ceyrek_Etkin_Kullanici_ve_Etkilesim_Suresi_Verileri.pdf"}, {"n": 4, "l": 4, "f": "B.3.1-2025_Yili_4_Ceyrek_Etkin_Kullanici_ve_Sayfa_Trafigi_Verileri.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[4](4)B.3.1-2025_Yili_4_Ceyrek_Etkin_Kullanici_ve_Sayfa_Trafigi_Verileri.pdf"}, {"n": 5, "l": 4, "f": "B.3.1-Kurum_Clarity_Avrasya_Performansa genel bakış_LMS_LCP.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[5](4)B.3.1-Kurum_Clarity_Avrasya_Performansa genel bak%C4%B1%C5%9F_LMS_LCP.pdf"}, {"n": 6, "l": 4, "f": "B.3.1-Kurum_Clarity_Avrasya_Performansa genel bakış_LMS_LCP.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[6](4)B.3.1-Kurum_Clarity_Avrasya_Performansa genel bak%C4%B1%C5%9F_LMS_LCP.pdf"}]}, "B.3.2": {"od": "Kurumda öğrencilerin akademik gelişimi ve kariyer planlamasına ilişkin uygulamalar izlenmekte ve öğrencilerin katılımıyla iyileştirilmektedir.", "p": ["Kurumda öğrencilerin akademik gelişimlerini izleyen, onlara yön gösteren ve kariyer planlamalarına destek olan akademik danışmanlık sistemi öğrenci merkezli bir yaklaşımla yönetilmektedir. 2024 yılı KİDR raporunda da belirtildiği üzere; öğrencilere ilgili mevzuat hükümleri kapsamında akademik danışmanlar atanmakta, ders seçimleri ve kariyer hedefleri danışmanları ile birlikte sistematik olarak planlanmaktadır. 2025 yılı itibarıyla, akademik danışmanlık sistemini sadece ders seçimiyle sınırlı tutmayan Kurum, öğrencilerin psikolojik, sosyal ve mesleki gelişimlerini desteklemek üzere hizmet ağını genişletmiştir.", "Kurum bünyesinde Kariyer Geliştirme ve Planlama Uygulama ve Araştırma Merkezi koordinasyonunda  yürütülen kariyer süreçlerinde; Cumhurbaşkanlığı İnsan Kaynakları Ofisi (CBİKO) Yetenek Kapısı platformunda yer alan işveren veri tabanı, öğrencilerin kariyer gelişimi, staj planlaması ve mezun istihdam süreçlerinin etkin yönetimi amacıyla sistematik olarak analiz edilmektedir [2_OD4].", "Sistematik olarak analiz edilen bu dijital etkileşim platformu üzerinde izleme yılı itibarıyla; 6.042 kayıtlı öğrenci/mezun ile 1.516 işverenin iletişim bilgisi bulunmakta olup, 3.480 iş/staj ilanı (38'i aktif) ve 1.450 kariyer etkinlik ilanı öğrencilerin erişimine sunulmuştur (\u0001https://yetenekkapisi.gov.tr/\u0002OD4)\u0003.", "Yapılan veri analitiği çalışmaları sonucunda; 1.516 işverenden oluşan kurumsal iletişim ağının sektörel olarak özellikle bilişim teknolojileri (128 firma), turizm ve konaklama (63 firma), eğitim (57 firma), tekstil (48 firma) ve lojistik (34 firma) alanlarında yoğunlaştığı; bölgesel olarak ise işverenlerin %50'den fazlasının İstanbul (415), Ankara (183) ve İzmir (90) gibi büyük metropollerde konumlandığı tespit edilmiştir. Kurumun bölgesel kalkınma misyonu açısından kritik öneme sahip olan Trabzon bağlantılı işveren sayısının ise 60 olduğu nesnel olarak raporlanmıştır [3_OD3].", "Elde edilen bu analitik bulgular doğrultusunda; program–sektör uyumunun güçlendirilmesine, dijital ve hizmet sektörlerinin baskın olduğu mevcut ağ dikkate alınarak kariyer hizmetlerinin (sektör buluşmaları, staj yönlendirmeleri vb.) sektörel odaklı yeniden yapılandırılmasına ve özellikle yerel/bölgesel iş birliklerinin artırılmasına yönelik kurumsal iyileştirme faaliyetleri yürütülmektedir.", "Bununla birlikte, Kurumun tavizsiz şekilde uyguladığı veri güvenliği politikaları, 6698 sayılı Kişisel Verilerin Korunması Kanunu (KVKK) yükümlülükleri ve kurumsal gizlilik ilkeleri uyarınca platformda yer alan işveren iletişim detaylarını içeren ham veri seti kamuya açık olarak paylaşılmamaktadır. Ancak veri setinden elde edilen özet bulgular ve demografik/sektörel analiz sonuçları; kurumsal kalite güvencesi raporlamalarında kullanılmakta, stratejik karar alma mekanizmalarına veri temelli girdi sağlamakta ve şeffaflık ilkesi gereği uygun istatistiksel düzeyde kamuoyu ile paylaşılmaktadır."], "ev": [{"n": 1, "l": 4, "f": "B.3.2-shmyo_akran_soylesisi.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.3.2-shmyo_akran_soylesisi.pdf"}, {"n": 2, "l": 4, "f": "B.3.2-Yetenek_Kapisi_Ogrenci_ve_Isveren_Istatistikleri.docx", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.3.2-Yetenek_Kapisi_Ogrenci_ve_Isveren_Istatistikleri.docx"}, {"n": 3, "l": 3, "f": "B.3.2-Akademik_destek_hizmetleri_ic_analiz_raporu.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[3](3)B.3.2-Akademik_destek_hizmetleri_ic_analiz_raporu.pdf"}]}, "B.3.3": {"od": "Tesis ve altyapının kullanımı izlenmekte ve ihtiyaçlar doğrultusunda iyileştirilmektedir.", "p": ["Avrasya Üniversitesi'nde eğitim-öğretim, araştırma ve barınma faaliyetlerini destekleyecek fiziksel alanlar ile bilişim altyapısı, öğrenci merkezli bir yaklaşımla tasarlanarak güvence altına alınmıştır. Kurumun kendi mülkiyetindeki beş yerleşkede toplam 155.785 m² alan (52.186 m² kapalı, 103.599 m² nitelikli açık alan) bulunmaktadır. Bu kapsamda; 139 derslik, 40 laboratuvar, 4 atölye ile eğitim (12.892 m²), araştırma (3.201 m²), kütüphane (3.520 m²), spor (4.437 m²) ve sosyal etkinlik (3.370 m²) alanları fırsat eşitliği temelinde tüm öğrencilerin ücretsiz erişimine sunulmuştur. Kurumun mevcut fiziksel kapasitesi, Yükseköğretim Kurulunun belirlediği öğrenci başına 12 m² (TZÖB) standardını fazlasıyla karşılamaktadır.", "Eğitim-öğretim süreçlerinin dijitalleşmesi ve erişilebilirliği kapsamında; Kuruma kayıtlı tüm öğrencilere avrasya.edu.tr uzantılı kurumsal e-posta hesapları tanımlanmış ve ücretsiz Microsoft lisans abonelikleri sağlanarak öğrencilerin teknolojik olanakları genişletilmiştir. Tesis ve bilişim altyapılarının amaca uygunluğu ile kullanım verimliliği, Kurum tarafından uygulanan Öğrenci Memnuniyet Analizi ve İyileştirme Stratejileri Raporu üzerinden düzenli olarak izlenmektedir (PUKÖ - Kontrol Etme). Yapılan analiz sonuçlarına göre; öğrencilerin Fiziki Altyapı/Güvenlik ve Dijital Hizmetler boyutlarındaki memnuniyet oranlarının son derece yüksek seviyede seyrettiği nesnel olarak tespit edilmiştir.", "Elde edilen veriler, paydaş geri bildirimleri ve çağın gereksinimleri doğrultusunda, tesis ve altyapının sürekli olarak güncel tutulması amacıyla iyileştirme adımları atılmaktadır. Örneğin; tüm yerleşkelerdeki dersliklerde standart eğitim donanımları eksiksiz olarak bulunmakla birlikte, dış paydaşlardan gelen disiplinlerarası eğitim talepleri dikkate alınarak Bilimsel Araştırma Projeleri (BAP) destekleri kapsamında Kurum bünyesinde yeni bir STEM Laboratuvarı kurulmuş ve araştırma-geliştirme altyapısı çok yönlü uygulama imkânlarıyla güçlendirilmiştir. Ayrıca yerleşkelerdeki açık ve kapalı alanlar; açık hava konserleri, sergiler ve kongreler gibi geniş katılımlı organizasyonlara ev sahipliği yapacak şekilde çok amaçlı hale getirilmiştir."], "ev": []}, "B.3.4": {"od": "Dezavantajlı grupların eğitim olanaklarına erişimine yönelik uygulamalar izlenmekte ve dezavantajlı grupların görüşleri de alınarak iyileştirilmektedir.", "p": ["Üniversitemiz bünyesinde dezavantajlı gruplara yönelik faaliyet gösteren birimler aşağıda listelenmiştir.", "Engeli Öğrenci Birimi, Göç Sorunları Uygulama ve Araştırma Merkezi, Türkçe Öğretim Merkezi, Kadın Çalışmaları Uygulama ve Araştırma Merkezi, Bağımlılıkla Mücadele Uygulama ve Araştırma Merkezi, Psikolojik Danışmanlık ve Rehberlik Birimi", "Avrasya Üniversitesi Engelli Birimi; Yükseköğretim Kurumları Engeliler Danışma ve Koordinasyon Yönetmeliği’nin 11 inci maddesinin birinci fıkrası uyarınca oluşturularak faaliyetlerine başlamıştır. Avrasya Üniversitesi Engeli Birimi; engelli yükseköğrenim öğrencilerinin akademik, idari, fiziksel, psikolojik, barınma ve sosyal alanlarla ilgili ihtiyaçlarını tespit etmek ve bu ihtiyaçların karşılanması için yapılması gerekenleri belirleyip, yapılacak çalışmaları planlamak, uygulamak, geliştirmek ve yapılan çalışmaların sonuçlarını değerlendirmek misyonu çerçevesinde; engel ve engelli bireyler ile ilgili farkındalık ve bilinç düzeyinin arttırılmasını hedeflemektedir. Avrasya Üniversitesi Engelli Birimi Esaslarının Eğitim-Öğretim Uygulamaları başlıklı üçüncü kısmında ders uygulamaları, sınav uygulamaları, ders muafiyeti ve intibak, akademik destek hususlarında kurum, birim, danışmanlar ve öğretim elemanlarının görev yetki ve sorumlulukları belirlenmiş ve paylaşılmıştır. Bu bağlamda; Üniversitemize yerleşen engelli öğrencilerin ilk tespiti kayıt esnasında başlayan bir süreç içerisinde yürütülmekte ve ilgili öğrenciler Engelli Birimi üzerinden bağlı olduğu akademik birim danışmanına yönlendirilmektedir. İlgili danışman, engelli öğrencilerimizin durumunu ve ihtiyaçlarını belirlemek adına Engelli Öğrenci Tespit Formu  ile gerekli bilgileri edinmekte ve form ile edinilen bilgiler kapsamında öğrenci ile yapılan görüşme sonuçları Engelli Öğrenci Danışma ve Koordinasyon Birimi Yönergesi çerçevesinde Engelli Öğrenci Birimine iletilmektedir. Üniversite bünyesinde kayıtlı bulunan engelli öğrencilerin karşılaştıkları dezavantajları ortadan kaldırmak ve onların Üniversitede akademik, sosyal ve kültürel ortamlara eşit fırsatlarla katılımlarını sağlamaya yönelik yerleşkelerde uygun fiziki koşulların sağlanması için tasarım çalışmaları devam etmektedir. Ömer YILDIZ Yerleşkesinde 2020-2021 döneminde inşaatı devam eden ve 2021-2022 döneminde inşaatı tamamlanan Eczacılık ve Diş Hekimliği Fakültelerine ait binada; engelli rampaları, tutunma trabzanları, engelli asansörleri, engelli tuvaletleri vb. yapımı tamamlanmıştır. 2024-2025 Eğitim Öğretim yılında Yomra Yerleşkesi, Pelitli Yerleşkesi ve Ömer Yıldız Yerleşkelerinde engelli tuvaletlerine panik butonları ve eğimli aynalar takılmış, aynı zamanda görme engelliler için izli yollar ve yönlendirme tabelaları düzenlenmiştir. Eğitim-Öğretim döneminde de üniversitemizi kazanan farklı dezavantaja sahip öğrencilerin eğitimlerini sürdürebilmelerini kolaylaştırıcı önlemler alınmıştır. Birim Üniversitemiz İş Sağlığı ve Güvenliği Kurulu ile koordineli çalışmakta ve alınan kurul kararları uyarınca gerçekleştirilecek fiziki düzenlemeler için öğrenci ihtiyaçları ile ilgili bilgi sunarak önerilerde bulunmaktadır. Dezavantajlı gruplara yönelik üniversitemiz tarafından gerçekleştirilen çalışmalara ilgili birim Web sitesinde yer almaktadır (ODR4) . Ayrıca Psikolojik Danışmanlık ve Rehberlik Birimi tarafından psikolojik destek hizmetleri ücretsiz sunulmaktadır (ODR4) . Üniversitemiz bünyesinde dezavantajlı gruplara yönelik düzenlenen faaliyetlere;", "Göç ve Mültecilikte Kırılgan Gruplar: Kadın ve Çocuk Perspektifleri Konferansı (ODR4)", "Görme/Fiziksel sağlık sorunu olan öğrencinin talebiyle sınavların okuyucu eşliğinde ve 20 punto yapılması kararıyla kapsayıcı iyileştirme yapılmıştır [1_OD4].[2_OD4]."], "ev": [{"n": 1, "l": 4, "f": "B.3.4-shmyo_engelli_sinav_destek.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.3.4-shmyo_engelli_sinav_destek.pdf"}, {"n": 2, "l": 4, "f": "B.3.4-shmyo_engelli_ders_destek.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.3.4-shmyo_engelli_ders_destek.pdf"}]}, "B.3.5": {"od": "Sosyal, kültürel ve sportif faaliyet mekanizmaları izlenmekte, ihtiyaçlar/talepler doğrultusunda faaliyetler çeşitlendirilmekte ve iyileştirilmektedir.", "p": ["Kurumumuzda öğrencilerin akademik eğitimlerinin yanı sıra sosyal, kültürel ve sportif gelişimlerini bütünleşik olarak desteklemek amacıyla Sağlık, Kültür ve Spor Daire Başkanlığı (SKS) koordinasyonunda sistematik bir yapı işletilmektedir. Bu faaliyetler, Kurumun 2026-2030 Stratejik Planı'nda yer alan \"Hedef 1.3: Öğrenci Başarısı, Sosyal Gelişim ve Memnuniyet Düzeyi Artırılacaktır\" vizyonu ve (PG 1.3.1) öğrenci odaklı etkinlik sayısı performans göstergesi ile doğrudan uyumlu olarak planlanmaktadır (\u0001https://avrasya.edu.tr/stratejik-plan/\u0002OD3\u0003).", "Öğrenci kulüplerinin faaliyetleri, yönetime doğrudan katılmayan ancak rehberlik/mentörlük faaliyeti yürüten atanmış Akademik Kulüp Danışmanları eşliğinde sürdürülmektedir. Fırsat eşitliği ve erişilebilirlik ilkeleri gözetilerek, öğrenci topluluklarının etkinlikleri için üniversitenin amfileri, konferans salonları ve spor alanları fiziksel kaynak olarak tahsis edilmektedir. Kurum genelinde her öğrencinin ilgisine hitap edecek çeşitlilikte ve kapsayıcılıkta faaliyetler uygulanmaktadır. Sosyal, kültürel ve sportif faaliyetlerin etkililiği ve ulaştığı kapasite, Kurum tarafından  eğitim- öğretim yılları bazında karşılaştırmalı olarak analiz edilmektedir. Yapılan kurumsal izleme analizlerine göre; 2023-2024 eğitim-öğretim yılında öğrenci kulüplerince düzenlenen toplam etkinlik sayısı 89 iken, 2024-2025 döneminde %29,21'lik bir artışla 115'e yükselmiştir. Benzer şekilde bu faaliyetlere katılım gösteren öğrenci sayısı da 11.327'den %30,71'lik belirgin bir artışla 14.806'ya ulaşmıştır.", "Elde edilen bu performans verileri, SKS Daire Başkanlığı ve ilgili komisyonlarca izlenmekte; öğrencilerin sosyal ve kültürel faaliyetlere katılım motivasyonlarının arttığı teyit edilerek, süreç ihtiyaçlar ve talepler doğrultusunda sürekli olarak iyileştirilip çeşitlendirilmektedir.", "Eğitim-öğretim faaliyetleri, akademik etkinlikler ve öğrenci odaklı uygulamalara ilişkin basın yansımaları, öğrenme süreçlerinin toplumsal karşılığı ve görünürlüğü bağlamında değerlendirilmekte ve kalite güvencesi süreçlerine veri sağlamaktadır [1_OD4]", "18 Mart Çanakkale Zaferi ve Şehitleri Anma Günü Programı (Ömer Yıldız Yerleşkesi) (\u0001https://www.youtube.com/watch?v=VeRoW6tRCiI\u0002ODR4\u0003). 8 Mart Dünya Kadınlar Günü Etkinliği (\u0001https://www.youtube.com/watch?v=ThzkA8rmpxA\u0002ODR4\u0003). 27 Mayıs Türk Mutfağı Haftası Etkinliği (\u0001https://www.youtube.com/watch?v=m47KxCUHHio\u0002ODR4\u0003). Cumhuriyetin Anlam ve Önemi Etkinliği (\u0001https://www.youtube.com/watch?v=sfyFuhlkdr4\u0002ODR4\u0003). Gastronomi ve Mutfak Sanatları Farkındalık Etkinliği (\u0001https://www.youtube.com/watch?v=m47KxCUHHio\u0002ODR4\u0003). Dış Paydaşımız Sınav Koleji Öğrencileri 23 Nisan Ulusal Egemenlik ve Çocuk Bayramı Etkinliği (\u0001https://www.instagram.com/avrasyaunv/p/DIwOxuLoG6U/?img_index=1\u0002ODR4\u0003). Avrasya Üniversitesi Öğrencileriyle İftar Programı (\u0001https://www.facebook.com/photo?fbid=1204840411651168&set=pcb.1204840441651165\u0002ODR4\u0003)."], "ev": [{"n": 1, "l": 4, "f": "B.3.5-Egitim-Ogretim_Basın_Rapor.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[1](4)B.3.5-Egitim-Ogretim_Bas%C4%B1n_Rapor.pdf"}, {"n": 2, "l": 4, "f": "B.3.5-Egitim_Ogretim_Sosyal_Medya.pdf", "u": "https://api.yokak.gov.tr/Storage/avrasya/2025/ProofFiles/[2](4)B.3.5-Egitim_Ogretim_Sosyal_Medya.pdf"}]}, "B.4.1": {"od": "", "p": ["Öğretim elemanı atama, yükseltme ve görevlendirme süreç ve kriterleri Avrasya Üniversitesi Atama Yükseltme Yönergesi ile belirlenmiş ve üniversite resmi web sitesinde yayınlanarak tüm paydaşlarımıza ve kamuoyuna ilan edilmiştir. Üniversitemiz bünyesinde yürütülen ders görevlendirme işlemleri bağlamında eğitim- öğretim kadrosunun yetkinlikleri (çalışma alanı/akademik uzmanlık alanı vb.) ile ders içeriklerinin örtüşmesi akademik birimlerin ilgili kuru larınca güvence altına alınmaktadır. Akademisyen kadrosunun eğitim-öğretim performansını izlemek üzere her yarıyıl sonunda öğretim elemanı/ders değerlendirme anketi uygulaması gerçekleştirilmektedir. Bu uygulama ile öğretim elemanları öğrenci geri bildirimleri doğrultusunda ders performanslarını değerlendirme ve ders içeriklerini gözden geçirme şansına sahip olmaktadırlar (ODR4)"], "ev": []}, "B.4.2": {"od": "Öğretim yetkinliğini geliştirme uygulamalarından elde edilen bulgular izlenmekte ve izlem sonuçları öğretim elamanları ile birlikte irdelenerek önlemler alınmaktadır.", "p": ["Avrasya Üniversitesi bünyesindeki akademik personelin öğretim yetkinlikleri ve eğitsel performansları, kurumsal akademik performans değerlendirme süreçleri kapsamında sistematik olarak ele alınmaktadır. Bu değerlendirme çerçevesinde, Öğretim Elemanı ve Ders Değerlendirme Anketleri gibi araçlar vasıtasıyla, öğretim elemanlarının pedagojik performanslarına ilişkin düzenli ve yapılandırılmış geri bildirimler temin edilmekte ve bu veriler performansın izlenmesi ile geliştirilmesinde kulanılmaktadır (ODR4). Akademik personelimizin öğretim yetkinliklerinin geliştirilmesi için kurum içinde sistematik eğitimler düzenlenmektedir. Etkili Sunum Teknikleri Eğitimi (ODR4), ÜNİDOKAF Eğiticileri Eğitimi Programı bu eğitimlere örnek gösterilebilir. Aynı zamanda üniversitemizde görev yapan olan tüm öğretim elemanlarının Eğiticinin Eğitimi Programını tamamlaması zorunluluktur (ODR4). Üniversitemizde yürütülen süreçler kapsamında yapılan yenilikler sonrası oryantasyon eğitimleri verilmektedir. Tüm akademik personelimize Proliz firması tarafından \"Sınav Kazanımı Akreditasyon Uyum ve Raporlama İşlemleri Modülü\" ve \"Akademisyen Soru Bazlı Not Girişi Anket Modülü\" tanıtımı ve kulanımına ilişkin bilgilendirme eğitimi bu eğitimlere örnek gösterilebilir"], "ev": []}, "B.4.3": {"od": "Teşvik ve ödül uygulamaları izlenmekte ve iyileştirilmektedir.", "p": ["Teşvik ve ödülendirme uygulamaları kurum geneline yayılmıştır. Öğretim elemanlarının araştırma projeleri ve akademik çalışmaları BAP kapsamında üniversite", "öz kaynaklarıyla desteklenmektedir. 2024-2025 eğitim öğretim yılında araştırma- geliştirme projelerine verilen toplam destek miktarında artış sağlanmıştır. Ayrıca öğretim elemanlarımızın edindiği başarılar, kurum resmi iletişim kanallarından ilan edilerek diğer öğretim elemanları için bir farkındalık oluşturulmaktadır (\u0001https://avrasya.edu.tr/akademik-basarilarimiz/\u0002ODR4\u0003)."], "ev": []}};
function lvlOf(item,text){if(!text)return 0;const tk=s=>new Set(s.toLowerCase().replace(/[^\p{L}\s]/gu,' ').split(/\s+/).filter(w=>w.length>3));const a=tk(text);let best=0,bi=0;item.levels.forEach((lv,i)=>{const b=tk(lv);let n=0;a.forEach(w=>b.has(w)&&n++);const sc=n/Math.max(1,new Set([...a,...b]).size);if(sc>best){best=sc;bi=i+1}});return bi}
function badge(t){return t.split(/(\x01[^\x02]*\x02[^\x03]*\x03)/).map(s=>{const m=s.match(/^\x01([^\x02]*)\x02([^\x03]*)\x03$/);if(!m)return escapeHtml(s);const lb=m[2].trim(),d=(lb.match(/OD[R]?(\d)/)||[])[1];return /^https?:/i.test(m[1])?`<a class="${d?'od d'+d:'lnk'}" href="${escapeHtml(m[1])}" target="_blank" rel="noopener noreferrer" title="Kanıtı yeni sekmede aç">${escapeHtml(lb)}</a>`:escapeHtml(m[2])}).join('')}
const items=()=>rubricData.flatMap(s=>s.items);
function enhance(){
  const tb=document.createElement('div');tb.className='toolbar';
  tb.innerHTML=`<div class="prog"><div class="prog-bar"><div class="prog-fill" id="pf"></div></div><small id="pt"></small></div>
  <button class="tb-btn" onclick="toggleAll(true)">Tümünü Aç</button><button class="tb-btn" onclick="toggleAll(false)">Tümünü Kapat</button>
    <button class="tb-btn" id="bk" onclick="document.querySelectorAll('.kidr').forEach(d=>d.open=!d.open)">Kurum KİDR Beyanlarını Aç/Kapat</button>
  <button class="tb-btn" id="bd" onclick="document.getElementById('main-content').classList.toggle('hide-done');this.classList.toggle('on')">Yalnızca Puanlanmamışlar</button>`;
  document.querySelector('.nav-panel').after(tb);
  items().forEach(it=>{const c=it.id.replace(/\./g,'-'),d=kidrData[it.id],box=document.getElementById('val-'+c).closest('.sub-item');
    it.claim=d?lvlOf(it,d.od):0;
    const ttl=box.querySelector('.sub-title');ttl.innerHTML+=` ${it.claim?`<span class="claim">Kurum olgunluk puanı: S${it.claim}</span>`:''}<span class="chip" id="chip-${c}" style="display:none"></span>`;
    document.getElementById(`sugg-claim-${c}`).innerHTML=`Kurum olgunluk puanı: <b>${it.claim?`S${it.claim}`:'Belirtilmemiş'}</b>`;
    if(!d)return;
    const ev=d.ev.length?`<ul class="ev-list">${d.ev.map(f=>`<li><span class="od d${f.l}">[${f.n}] OD${f.l}</span> ${f.u?`<a class="lnk" href="${escapeHtml(f.u)}" target="_blank" rel="noopener noreferrer">${escapeHtml(f.f)}</a>`:escapeHtml(f.f)}</li>`).join('')}</ul>`:'<div class="ev-none">⚠ Kurum bu ölçüt için kanıt dosyası listelememiştir.</div>';
    const p=document.createElement('details');p.className='kidr';
    p.innerHTML=`<summary>Kurumun KİDR Beyanı ve Kanıtları (${d.ev.length} kanıt)</summary><div class="kidr-in">${d.od?`<div class="kidr-od">Kurum olgunluk puanının açıklaması: ${escapeHtml(d.od)}</div>`:''}${d.p.map(x=>`<p>${badge(x)}</p>`).join('')}<b>Kanıtlar</b>${ev}</div>`;
    box.querySelector('.interactive-panel').before(p)});
  const sl=document.getElementById('summary-list');sl.insertAdjacentHTML('afterend','<div class="sb-cmp" id="cmp"></div>');
  const dr=document.createElement('div');dr.className='draft';dr.id='draft';document.querySelector('.toolbar').after(dr);
  document.addEventListener('input',saveDraft);document.addEventListener('change',saveDraft);showDraft();updateMeta()}
function toggleAll(o){document.querySelectorAll('.sub-item').forEach(e=>e.classList.toggle('collapsed',!o));document.querySelectorAll('.section-card').forEach(e=>e.classList.remove('collapsed'))}
function updateMeta(){let n=0,cs=0,cc=0,ss=0;
  items().forEach(it=>{const c=it.id.replace(/\./g,'-'),v=parseInt(document.getElementById('val-'+c)?.value)||0,box=document.getElementById('val-'+c)?.closest('.sub-item'),ch=document.getElementById('chip-'+c);
    box&&box.classList.toggle('done',v>0);if(v>0){n++;ss+=v}
    if(ch){if(v&&it.claim){const df=v-it.claim;ch.style.display='';ch.className='chip '+(df>0?'up':df<0?'down':'eq');ch.textContent=`Siz: S${v} ${df>0?'▲ +'+df:df<0?'▼ '+df:'= olgunluk puanıyla uyumlu'}`;cs+=it.claim;cc++}else ch.style.display='none'}});
  const t=items().length;document.getElementById('pf').style.width=(n/t*100)+'%';document.getElementById('pt').textContent=`${n} / ${t} ölçüt puanlandı`;
    document.getElementById('cmp').innerHTML=cc?`Kurum olgunluk puanı ort.: <b>${(cs/cc).toFixed(2)}</b> · Değerlendirme ort.: <b>${(ss/n).toFixed(2)}</b> <br>Olgunluk puanından farklı ölçüt: <b>${document.querySelectorAll('.chip.up,.chip.down').length}</b>`:'Puanladıkça kurum olgunluk puanıyla karşılaştırma burada görünür.'}
const _ct=calculateTotal;calculateTotal=function(){_ct();if(document.getElementById('pf'))updateMeta()};
const DK='kidr_draft_v1';let dt;
function saveDraft(){clearTimeout(dt);dt=setTimeout(()=>{try{const d={t:Date.now(),no:document.getElementById('proj-no').value,nm:document.getElementById('proj-name').value,s:{},k:{},c:{},o:['summary','strengths','weaknesses'].map(x=>document.getElementById('overall-'+x).innerHTML)};
  items().forEach(it=>{const c=it.id.replace(/\./g,'-');d.s[c]=document.getElementById('val-'+c).value;d.c[c]=document.getElementById('comment-'+c).innerHTML;d.k[c]=it.checks.map((_,i)=>(document.querySelector(`input[name="L-${c}-${i}"]:checked`)||{}).value||0)});
  if(Object.values(d.s).some(v=>v!=='0'))localStorage.setItem(DK,JSON.stringify(d))}catch(e){}},900)}
function showDraft(){try{const d=JSON.parse(localStorage.getItem(DK)||'null');if(!d)return;const el=document.getElementById('draft');el.style.display='flex';
  el.innerHTML=`💾 Kaydedilmemiş taslak bulundu (${new Date(d.t).toLocaleString('tr-TR')}). <button class="tb-btn" onclick="restoreDraft()">Geri Yükle</button><button class="tb-btn" onclick="localStorage.removeItem(DK);this.parentElement.style.display='none'">Sil</button>`}catch(e){}}
function restoreDraft(){const d=JSON.parse(localStorage.getItem(DK));document.getElementById('proj-no').value=d.no||'';document.getElementById('proj-name').value=d.nm||'';
  items().forEach(it=>{const c=it.id.replace(/\./g,'-');document.getElementById('comment-'+c).innerHTML=d.c[c]||'';(d.k[c]||[]).forEach((v,i)=>{if(+v){const r=document.getElementById(`L-${c}-${i}-${v}`);if(r)r.checked=true}});calculateSuggestion(c);if(+d.s[c])selectScore(c,+d.s[c])});
  ['summary','strengths','weaknesses'].forEach((x,i)=>document.getElementById('overall-'+x).innerHTML=d.o[i]||'');document.getElementById('draft').style.display='none'}
window.onload=function(){init();enhance()};

</script>
